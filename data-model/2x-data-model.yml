note: >-
  Entity-relationship graph derived from the 26 component schemas and the id-reference fields
  in the Knownwell Commercial Intelligence API. Every entity is tenant-scoped by customerId,
  which is the root of the whole model — it appears on every response envelope, not just on
  records, so a caller's key implicitly selects the tenant.
tenancy:
  root_field: customerId
  note: >-
    customerId is present on ClientResponse, StreamResponse, PortfolioResponse,
    PortfolioHealthResponse and on every list envelope. It is never a request parameter,
    which means the API key determines the tenant and a client cannot address another
    tenant's data.
entities:
- name: Client
  schemas: [ClientResponse, ClientDetailResponse]
  id_field: id
  description: >-
    An account under commercial-intelligence measurement. Carries the Knownwell score, its
    provenance (scoreSource), 7-day and 30-day score deltas, last contact date, an
    insufficient-data flag, an archived flag and a historical score series.
  key_fields: [id, customerId, name, score, scoreSource, scoreChanges, lastContactDate, archived, historicalData]
  detail_only_fields: [spotlightSummary, topics]
- name: ClientMetadata
  schemas: [ClientMetadata]
  description: >-
    Firmographic and commercial attributes attached to a client — account owner, industry,
    location, domain, client type, account status, annual revenue, trailing-twelve-month and
    forward-twelve-month revenue.
  embedded_in: Client
- name: Stream
  schemas: [StreamResponse, StreamDetailResponse]
  id_field: id
  description: >-
    A revenue or engagement stream belonging to a client — separately scored, with its own
    state, goals and history. The detail form adds narrative AI output (spotlight, insights,
    contextualClues, growthRecommendations).
  key_fields: [id, name, customerId, parentClientId, score, streamState, goals]
- name: Portfolio
  schemas: [PortfolioResponse, PortfolioDetailResponse]
  id_field: id
  description: >-
    A named grouping of clients, owned by a set of users. May be system-managed (isSystem).
    The detail form embeds its clients, its users and its aggregate health.
  key_fields: [id, name, customerId, clientCount, userIds, isSystem]
- name: PortfolioHealth
  schemas: [PortfolioHealthResponse]
  description: aggregate score with a breakdown and a distribution across risk bands
  key_fields: [score, breakdown, distribution, customerId, chr2CutoverDate]
- name: PortfolioUser
  schemas: [PortfolioUser]
  id_field: id
  key_fields: [id, displayName, email]
- name: Alignment
  schemas: [AlignmentRead, ClientAlignment, ClientAlignmentResponse]
  description: >-
    A weekly per-client alignment value with an audit trail (updatedAt, updatedBy). Addressed
    by ISO week rather than by id.
  key_fields: [value, week, updatedAt, updatedBy]
- name: ScoreChange
  schemas: [ScoreChange, ScoreChanges]
  description: score delta over a window — absolute change, percentage, and previous score
  windows: ['7day', '30day']
- name: Topic
  schemas: []
  description: >-
    Listed by list_topics_v1_topics_get and referenced from ClientDetailResponse.topics, but
    the spec types topics as a free-form object array with no named schema, so the topic
    entity has no machine-readable shape.
  note: untyped in the contract
- name: APIKey
  schemas: [APIKeyCreate, APIKeyResponse, APIKeyScope]
  id_field: id
  description: >-
    Administrative credential record. The plaintext api_key field is populated only on
    creation.
  key_fields: [id, customer_id, name, scope, status, created_at, expires_at, last_used_at]
  note: >-
    The only snake_case entity in the model — every other schema is camelCase. Its scope
    enum has exactly one member, read_only.
