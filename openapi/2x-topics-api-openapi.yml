openapi: 3.2.0
info:
  title: Knownwell Topics API
  description: API for accessing Knownwell client data and Knownwell scores
  version: v1
tags:
- name: topics
paths:
  /v1/topics:
    get:
      tags:
      - topics
      summary: List Topics
      operationId: list_topics_v1_topics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
