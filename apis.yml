apis:
- name: Knownwell MCP Server
  description: >-
    OAuth-protected remote Model Context Protocol server for the Knownwell commercial-intelligence platform.
    An MCP client POSTs JSON-RPC to the endpoint after completing an OAuth 2.1 authorization-code + PKCE
    flow; the server publishes RFC 8414 authorization-server metadata and RFC 9728 protected-resource
    metadata and supports dynamic client registration. The live tool list is auth-gated and was not observed.
  humanURL: https://api.knownwell.com/docs
  baseURL: https://mcp.knownwell.com/mcp
  tags:
  - MCP
  - Agentic AI
  - Commercial Intelligence
  properties:
  - type: MCPServer
    url: mcp/2x-mcp.yml
  - type: ToolCrosswalk
    url: mcp/2x-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/2x-scopes.yml
  - type: Authentication
    url: authentication/2x-authentication.yml
- name: 2X Website WordPress REST API
  description: >-
    The public WordPress REST API served by the 2x.com corporate website. It is anonymously readable and
    exposes 322 routes across 13 namespaces (wp/v2, yoast/v1, wp-abilities/v1, redirection/v1 and others),
    covering posts, pages, customer stories, open roles, testimonials and media. It also carries one first-party
    namespace 2X built itself, maturity/v1, which serves the submission records behind 2X's marketing-maturity
    assessment. This is content infrastructure provided by the CMS, not a 2X product API — recorded because
    it is a genuinely callable public surface on 2X's own domain.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://2x.com/wp-json/
  tags:
  - Content
  - CMS
  - WordPress
  properties:
  - type: Documentation
    url: https://developer.wordpress.org/rest-api/
