aid: 2x
name: 2X
description: 2X is a B2B go-to-market services company that delivers what it calls GTM
  Human-Agentic Services — AI agents, expert embedded teams, and intelligent workflows sold
  through a subscription model rather than a traditional agency retainer. Founded in 2017 by
  three former B2B CMOs including Domenic Colasante, 2X grew out of Marketing-as-a-Service
  (MaaS) into full go-to-market orchestration spanning marketing operations, MarTech
  management, campaign build and demand generation, content and creative production, GTM
  engineering, and revenue strategy consulting. In June 2026 2X acquired Knownwell, an
  AI-as-a-Service commercial-intelligence platform, in a transaction valued at more than
  $400M; Knownwell founder David DeWolf became 2X's CEO and Colasante remained as founder.
  2X also acquired GTM engineering firm The Kiln, a leading Clay implementation partner.
  With more than 1,000 team members across five continents, 2X serves over 150 enterprise
  clients including SAP, Ricoh, Docker, Seismic, Qlik, Brightcove, Emburse and GoTo, and is
  backed by private-equity firms Recognize and Insight Partners. Its public machine-readable
  API surface arrives through Knownwell — a documented REST API and an OAuth-protected remote
  MCP server for client, portfolio, and account-health intelligence.
