name: 2X
description: 2X is the global leader in B2B Marketing-as-a-Service (MaaS), a subscription-based
  alternative to traditional B2B marketing delivery models. Founded in 2017 by three former
  B2B CMOs and led by CEO Domenic Colasante, 2X provides AI-enabled marketing talent and
  strategic consulting spanning marketing operations, MarTech management, campaign build
  and demand generation, content and creative production, GTM engineering, and revenue
  strategy consulting. With more than 1,000 team members across five continents, 2X serves
  over 150 enterprise clients including SAP, Ricoh, Docker, Seismic, Qlik, and GoTo, and
  is backed by private-equity firms Recognize and Insight Partners.
